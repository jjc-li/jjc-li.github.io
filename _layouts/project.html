---
layout: default
---
<section class="project-hero">
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="muted">{{ page.subtitle }}</p>{% endif %}
</section>

<div class="project-layout">
  <aside class="project-sidebar" id="toc">
    <div class="toc-title">Sections</div>
    <nav class="toc-list" aria-label="On this page"><!-- JS injects nested list --></nav>
  </aside>

  <article class="project-main">
    {{ content }}
  </article>
</div>

<script>
/* Build a nested TOC from h2/h3 headings inside .project-main */
(function(){
  const main = document.querySelector('.project-main');
  const toc = document.querySelector('.toc-list');
  if (!main || !toc) return;
  const headings = main.querySelectorAll('h2[id], h3[id]');
  if (!headings.length) return;

  const rootList = document.createElement('ul');
  toc.appendChild(rootList);

  let currentLi = null;

  headings.forEach((h) => {
    const level = h.tagName.toLowerCase();
    const link = document.createElement('a');
    link.href = '#' + h.id;
    link.textContent = h.textContent;

    if (level === 'h2') {
      const li = document.createElement('li');
      li.appendChild(link);
      rootList.appendChild(li);
      currentLi = li;
    } else if (level === 'h3' && currentLi) {
      let subList = currentLi.querySelector('ul');
      if (!subList) {
        subList = document.createElement('ul');
        currentLi.appendChild(subList);
      }
      const subLi = document.createElement('li');
      subLi.appendChild(link);
      subList.appendChild(subLi);
    }
  });
})();
</script>
